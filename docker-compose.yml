version: '3.8'

services:
  ai-service:
    build: ./ai-service
    ports:
      - "5050:5050"
    networks:
      - chatbot-network

  backend:
    build: ./backend
    ports:
      - "3030:3030"
    environment:
      - AI_SERVICE_URL=http://ai-service:5050/chat
    depends_on:
      - ai-service
    networks:
      - chatbot-network

  frontend:
    build: ./frontend
    ports:
      - "3031:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:3030/chat
    depends_on:
      - backend
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge
